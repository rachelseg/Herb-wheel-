<title>Sanctuary Herb Wheel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;600&display=swap">
<style>
/* Layout: single dark apothecary column — title, framework tabs + lens panel, wheel, herb card, cup */
:root{
  --bg:#1B221D;--surface:#252E27;--surface-2:#2E382F;--raised:#222A24;--well:#1E2620;
  --ink:#EDE6D9;--ink-2:#D6CCB8;--muted:#A89D88;--faint:#8C8270;--cream:#F1E2C2;
  --brass:#C2A26B;--brass-ink:#E8D3A6;--brass-deep:#3D3526;
  --line:rgba(237,230,217,.16);--line-2:rgba(237,230,217,.28);
  --warn:#D9A35B;--danger:#D98A7A;--ok:#9DB38A;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.serif{font-family:var(--display);font-weight:500}
header{text-align:center;margin-bottom:6px}
header h1{font-family:var(--display);font-weight:500;font-size:34px;line-height:1.05;color:var(--cream);margin:0;text-wrap:balance}
header p{margin:6px 0 0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tab{padding:13px 12px;border-radius:10px;border:.5px solid var(--line);background:var(--raised);color:var(--ink-2);font-size:15px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.tab small{font-size:12px;color:var(--faint)}
.tab.on{background:#2C2A21;border:1.5px solid var(--brass);color:var(--cream)}
.tab.on small{color:var(--brass-ink)}
.panel{background:var(--surface);border:.5px solid rgba(194,162,107,.45);border-radius:12px;padding:14px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.panel-h span:first-child{font-family:var(--display);font-size:24px;color:var(--cream)}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.lens{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:11px 12px;margin-top:8px;border-radius:8px;border:.5px solid var(--line);background:var(--well);font-size:15px;text-align:left;cursor:pointer}
.lens .l{display:flex;align-items:center;gap:10px}
.lens .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.lens small{font-size:12px;color:var(--muted)}
.lens.on{background:var(--brass);color:var(--bg);border-color:var(--brass)}
.lens.on .dot{border-color:var(--bg);background:var(--bg);box-shadow:inset 0 0 0 3px var(--brass)}
.lens.on small{color:var(--brass-deep)}
.view{font-size:12px;color:var(--faint)}
.path{min-height:30px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.crumb{font-size:12px;padding:5px 11px;border-radius:999px;border:.5px solid rgba(194,162,107,.5);background:rgba(194,162,107,.15);color:var(--brass-ink);cursor:pointer}
svg.wheel{display:block;width:100%;max-width:100%;touch-action:manipulation}
.n{cursor:pointer;transition:opacity .2s}.dim{opacity:.18}.soft{opacity:.5}
.box{background:var(--surface);border-radius:12px;padding:14px 16px}
.cupbox{border:.5px solid rgba(194,162,107,.35)}
.tg{display:inline-block;font-size:12px;padding:3px 9px;border-radius:6px;margin:4px 4px 0 0;background:var(--surface-2);color:var(--ink-2);border:none}
button.tg{cursor:pointer;font-size:13px;padding:6px 11px;color:var(--ink);border:.5px solid var(--line)}
.btn{background:transparent;border:.5px solid var(--line-2);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
.btn.brass{border-color:var(--brass);color:var(--brass-ink)}
.mu{color:var(--muted)}
.hint{font-size:14px;color:var(--muted);line-height:1.6;margin:0}
.fl{display:flex;gap:10px;font-size:13px;line-height:1.5;margin-top:8px;color:var(--ink-2)}
.fl i{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.sec{margin-top:18px;padding-top:14px;border-top:.5px solid var(--line)}
.forms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.form{text-align:left;padding:10px 12px;border-radius:8px;border:.5px solid var(--line);background:var(--well);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.form b{font-weight:500;font-size:14px;color:var(--ink)}
.form small{font-size:12px;color:var(--muted)}
.form .best{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.form.on{border:1.5px solid var(--brass);background:#2C2A21}
.recipe{margin-top:12px;background:var(--well);border-radius:10px;padding:14px}
.recipe h3{font-family:var(--display);font-weight:500;font-size:22px;color:var(--cream);margin:0}
.recipe ol{margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.recipe li{font-size:14px;line-height:1.55;color:var(--ink-2);padding-left:4px}
.recipe li::marker{color:var(--brass);font-family:var(--display);font-size:17px}
.fits{font-size:13px;margin-top:8px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){.n{transition:none}}
</style>
</head>

function meter(lab,L,R,s,tgt,cl,cr){const pos=50+s*44;const lean=Math.abs(s)<.25?'Balanced':'Leans '+(s<0?L:R).toLowerCase();
